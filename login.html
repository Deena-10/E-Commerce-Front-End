<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Shoppino - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body class="loginbody">

<nav id="nav">
    <div class="nav-brand">
        <b>Shoppino</b>
    </div>
    <div class="nav-links">
        <a id="l" href="index.html">Home</a>
        <a href="contact.html">Contact Us</a>
    </div>
</nav>

<div id="signupform">

    <h3 id="formtitle">Sign Up To Shoppino</h3>

    <div id="signupcontent">

        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Email Id</td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Create a password"></td>
            </tr>

            <tr>
                <td>Re-Type Password</td>
                <td><input type="password" placeholder="Confirm password"></td>
            </tr>

            <tr>
                <td></td>
                <td><button id="formbutton">Submit</button></td>
            </tr>
        </table>

        <p id="formmessage">Already Have Account? Please <button id="LoginButton">Login</button></p>

    </div>

    <div id="logincontent">

        <table>
            <tr>
                <td>Email Id</td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter your password"></td>
            </tr>

            <tr>
                <td></td>
                <td><button id="formbutton2">Login</button></td>
            </tr>
        </table>

        <p id="formmessage2">Don't Have Account? Please <button id="SignupButton">Signup</button></p>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
